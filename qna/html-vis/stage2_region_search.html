<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阶段 2 · 区域关联（双向搜索）</title>
<style>
:root {
  color-scheme: light;
  --surface: #F7F7F8;
  --surface-muted: #EFEFF2;
  --text: #171717;
  --text-muted: #52525B;
  --border: rgba(23, 23, 23, 0.12);
  --brand: #0FDC78;
  --accent-2: #F87454;
  --radius-card: 12px;
  --spacer-8: 8px;
  --spacer-12: 12px;
  --spacer-20: 20px;
  --font-sans: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --weight-regular: 400;
  --weight-medium: 500;
  --text-caption: 12px/18px;
  --text-body: 14px/20px;
  --text-title: 16px/24px;
  --text-code: 13px/20px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface: #171717;
    --surface-muted: #262626;
    --text: #E5E5E5;
    --text-muted: #A1A1AA;
    --border: rgba(229, 229, 229, 0.12);
    --brand: #32F08C;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #FFFFFF;
  color: var(--text);
  font: var(--weight-regular) var(--text-body) var(--font-sans);
  padding: var(--spacer-20);
  display: flex;
  justify-content: center;
}
@media (prefers-color-scheme: dark) { body { background: #0B0B0B; } }
.viz { width: 100%; max-width: 960px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: var(--spacer-20);
}
.head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--spacer-12);
  flex-wrap: wrap;
  margin-bottom: var(--spacer-8);
}
.title { font: var(--weight-medium) var(--text-title) var(--font-sans); }
.code { font: var(--weight-medium) var(--text-code) var(--font-mono); color: var(--text-muted); }
svg { display: block; width: 100%; height: auto; }
.tt { fill: var(--text); font: var(--weight-medium) var(--text-body) var(--font-sans); }
.tc { fill: var(--text-muted); font: var(--weight-regular) var(--text-caption) var(--font-sans); }
.tn { fill: var(--text-muted); font: var(--weight-medium) var(--text-caption) var(--font-mono); }
.arr { stroke: var(--text-muted); stroke-width: 1.5; fill: none; stroke-linecap: round; }
.win { fill: none; stroke: var(--brand); stroke-width: 1.5; stroke-dasharray: 5 4; }
.win-dead { fill: none; stroke: var(--text-muted); stroke-width: 1.5; stroke-dasharray: 4 4; opacity: 0.4; }
.line { stroke: var(--text-muted); stroke-width: 1; opacity: 0.35; fill: none; }
.fill-soft { fill: var(--text-muted); opacity: 0.35; }
</style>
</head>
